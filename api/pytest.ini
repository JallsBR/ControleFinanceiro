[pytest]
DJANGO_SETTINGS_MODULE = app.settings
python_files = test_*.py
testpaths = users/tests financas/tests
# Com `docker compose exec -T` não há TTY — sem isto o pytest fica em modo sem cor.
# Respeita NO_COLOR no ambiente. Para desligar explicitamente: `pytest --color=no`.
# -vv: um método por linha com nome completo; -s: mostra o marcador por método (prints).
# Silêncio do marcador: `PYTEST_SILENCIAR_MARCADOR=1`. Para recapturar stdout: `pytest --capture=sys`.
addopts = --color=yes -vv -s
